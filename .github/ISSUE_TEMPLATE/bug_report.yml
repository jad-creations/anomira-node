name: Bug report
description: Something in the SDK or CLI is not working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. If this is a security issue, do **not** use this form — see [SECURITY.md](https://github.com/jad-creations/anomira-node/blob/main/SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A short summary of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps or a small code snippet.
      placeholder: |
        1. Install @anomira/node-sdk@…
        2. Register anomira.express() after express.json()
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include error messages and stack traces when you have them.
    validations:
      required: true
  - type: dropdown
    id: framework
    attributes:
      label: Framework
      options:
        - Express
        - Fastify
        - CLI (`anomira scan`)
        - Other / none
    validations:
      required: true
  - type: input
    id: sdk-version
    attributes:
      label: "@anomira/node-sdk version"
      placeholder: "0.2.7"
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: "20.11.0"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: "Logs with `debug: true`, proxy setup, auth library, or related PRs."
